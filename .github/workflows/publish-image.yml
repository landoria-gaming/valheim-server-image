---
name: Build and publish the Valheim image

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - Containerfile
      - valheim-entrypoint.sh
      - build-image.sh
      - .dockerignore
      - .github/workflows/publish-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: valheim-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-inventory:
    runs-on: [self-hosted, Linux, X64, valheim-image]
    outputs:
      test_hosts: ${{ steps.inventory.outputs.hosts }}
    steps:
      - id: inventory
        name: Resolve the test Valheim hosts
        uses: end3rbyte/valheim-root/.github/actions/resolve-inventory@master
        with:
          host-group: valheim
          environment: test

  build:
    runs-on: [self-hosted, Linux, X64, valheim-image]
    timeout-minutes: 45
    env:
      REGISTRY: ghcr.io
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Define image tags
        id: image
        shell: bash
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY,,}"
          image="${REGISTRY}/${repository}"
          commit_tag="sha-${GITHUB_SHA:0:7}"
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"
          printf 'commit_ref=%s:%s\n' "$image" "$commit_tag" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            printf 'release_ref=%s:%s\n' "$image" "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_NAME" == "$DEFAULT_BRANCH" ]]; then
            printf 'release_ref=%s:latest\n' "$image" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the image
        shell: bash
        env:
          VALHEIM_IMAGE: ${{ steps.image.outputs.commit_ref }}
        run: |
          set -euo pipefail
          CONTAINER_ENGINE=podman ./build-image.sh

      - name: Sign in to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" |
            podman login "$REGISTRY" --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish the image
        shell: bash
        env:
          COMMIT_REF: ${{ steps.image.outputs.commit_ref }}
          RELEASE_REF: ${{ steps.image.outputs.release_ref }}
        run: |
          set -euo pipefail
          podman push "$COMMIT_REF"
          if [[ -n "$RELEASE_REF" ]]; then
            podman tag "$COMMIT_REF" "$RELEASE_REF"
            podman push "$RELEASE_REF"
          fi

      - name: Clean the runner
        if: always()
        shell: bash
        env:
          COMMIT_REF: ${{ steps.image.outputs.commit_ref }}
          RELEASE_REF: ${{ steps.image.outputs.release_ref }}
        run: |
          set +e
          podman logout "$REGISTRY"
          [[ -z "$RELEASE_REF" ]] || podman image rm "$RELEASE_REF"
          [[ -z "$COMMIT_REF" ]] || podman image rm "$COMMIT_REF"
          exit 0

  deploy-test:
    name: deploy-test (${{ matrix.host }})
    needs: [build, resolve-inventory]
    runs-on: [self-hosted, Linux, X64, valheim-image]
    timeout-minutes: 20
    strategy:
      max-parallel: 1
      matrix:
        host: ${{ fromJSON(needs.resolve-inventory.outputs.test_hosts) }}
    environment:
      name: test
    steps:
      - name: Install and verify the tested image
        shell: bash
        env:
          DEPLOY_TARGET_HOST: ${{ matrix.host }}
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY,,}"
          image_reference="ghcr.io/${repository}:sha-${GITHUB_SHA:0:7}"
          ssh -o BatchMode=yes -o ConnectTimeout=10 \
            "$DEPLOY_TARGET_HOST" bash -s -- "$image_reference" <<'REMOTE'
          set -euo pipefail
          sudo env VALHEIM_IMAGE="$1" \
            /opt/landoria-ops/valheim-podman/images/pull-image.sh </dev/null
          REMOTE
