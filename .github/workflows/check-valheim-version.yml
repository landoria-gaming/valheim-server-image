name: Build and publish Valheim server image
permissions:
  contents: read
concurrency:
  group: valheim-build-cache
  cancel-in-progress: false
jobs:
  prepare-caches:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
    - name: Discard existing download caches
      if: inputs['discard-cache'] == true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        VALHEIM_CHANNEL: ${{ inputs.channel || 'current' }}
      run: |
        # Remove component caches before any download jobs start.
        set -euo pipefail
        case "$VALHEIM_CHANNEL" in
          current|public-test) ;;
          *) echo 'Invalid Valheim channel.' >&2; exit 1 ;;
        esac
        endpoint="repos/$GITHUB_REPOSITORY/actions/caches"
        caches="$(gh api "$endpoint?per_page=100" --paginate --slurp)"
        cache_ids="$(jq -r --arg channel "$VALHEIM_CHANNEL" '
          .[].actions_caches[] |
          select(.key | startswith("steamcmd-v1-linux-x64-") or
                        startswith("tcli-v1-linux-x64-") or
                        startswith("valheim-bepinex-v1-") or
                        startswith("valheim-server-v1-linux-x64-" + $channel + "-")) |
          .id' <<< "$caches")"
        while IFS= read -r cache_id; do
          [[ -n "$cache_id" ]] || continue
          [[ "$cache_id" =~ ^[0-9]+$ ]] || exit 1
          gh api --method DELETE "$endpoint/$cache_id"
        done <<< "$cache_ids"
  cache-steamcmd:
    needs: prepare-caches
    uses: ./.github/workflows/cache-steamcmd.yml
    permissions:
      contents: read
      actions: write
  cache-tcli:
    needs: prepare-caches
    uses: ./.github/workflows/cache-tcli.yml
    permissions:
      contents: read
      actions: write
  cache-valheim:
    uses: ./.github/workflows/cache-valheim.yml
    permissions:
      contents: read
      actions: write
    with:
      channel: ${{ inputs.channel || 'current' }}
      steamcmd_cache_key: ${{ needs.cache-steamcmd.outputs.cache_key }}
    needs: cache-steamcmd
  cache-bepinex:
    uses: ./.github/workflows/cache-bepinex.yml
    permissions:
      contents: read
      actions: write
    needs: cache-tcli
    with:
      tcli_cache_key: ${{ needs.cache-tcli.outputs.cache_key }}
      tcli_version: ${{ needs.cache-tcli.outputs.version }}
  build-and-publish-image:
    needs:
    - cache-valheim
    - cache-bepinex
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: write
      packages: write
    with:
      channel: ${{ inputs.channel || 'current' }}
      valheim_version: ${{ needs.cache-valheim.outputs.version }}
      valheim_build_id: ${{ needs.cache-valheim.outputs.build_id }}
      bepinex_version: ${{ needs.cache-bepinex.outputs.version }}
      valheim_cache_key: ${{ needs.cache-valheim.outputs.cache_key }}
      bepinex_cache_key: ${{ needs.cache-bepinex.outputs.cache_key }}
'on':
  schedule:
  - cron: 23 4 * * *
  workflow_dispatch:
    inputs:
      discard-cache:
        description: Discard download caches before rebuilding them
        required: false
        default: false
        type: boolean
      channel:
        description: Steam branch to cache
        required: true
        default: current
        type: choice
        options:
        - current
        - public-test
