---
name: Clean up GHCR images

on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  cleanup-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ghcr-valheim-server-x86-64
      cancel-in-progress: false
    steps:
      - name: Delete all Valheim image packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Delete current and legacy Valheim packages, including every version and tag.
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == landoria-gaming/valheim-server-image ]] || exit 1
          deleted=0
          for name in valheim-server-image valheim_server.x86_64; do
            endpoint="/orgs/landoria-gaming/packages/container/$name"
            printf '[GHCR] Deleting package %s and all its versions.\n' "$name"
            if response="$(gh api --include --method DELETE "$endpoint" 2>&1)"; then
              deleted=$((deleted + 1))
            elif [[ "$response" == *"(HTTP 404)"* ]]; then
              printf '[GHCR] Package %s was not found or is not accessible.\n' "$name"
            else
              printf '%s\n' "$response" >&2
              exit 1
            fi
          done
          printf '### GHCR cleanup\n\nDeleted %s Valheim packages and all their versions and tags.\n' \
              "$deleted" >> "$GITHUB_STEP_SUMMARY"
