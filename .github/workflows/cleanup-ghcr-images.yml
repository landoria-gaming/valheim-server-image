---
name: Clean up GHCR images

on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  cleanup-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ghcr-valheim-server-x86-64
      cancel-in-progress: false
    steps:
      - name: Delete all Valheim image packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Delete current and legacy Valheim packages, including every version and tag.
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == landoria-gaming/valheim-server-image ]] || exit 1
          endpoint=/orgs/landoria-gaming/packages
          packages="$(gh api "$endpoint?package_type=container&per_page=100" --paginate --slurp)"
          names="$(jq -r '.[][] | select(.name == "valheim-server-image" or
              .name == "valheim_server.x86_64") | .name' <<< "$packages")"
          deleted=0
          while IFS= read -r name; do
            [[ -n "$name" ]] || continue
            printf '[GHCR] Deleting package %s and all its versions.\n' "$name"
            gh api --method DELETE "$endpoint/container/$name"
            deleted=$((deleted + 1))
          done <<< "$names"
          remaining="$(gh api "$endpoint?package_type=container&per_page=100" --paginate --slurp)"
          jq -e '[.[][] | select(.name == "valheim-server-image" or
              .name == "valheim_server.x86_64")] | length == 0' <<< "$remaining" >/dev/null
          printf '[GHCR] Deleted %s packages; no Valheim images remain.\n' "$deleted"
          printf '### GHCR cleanup\n\nDeleted %s Valheim packages and all their versions and tags.\n' \
              "$deleted" >> "$GITHUB_STEP_SUMMARY"
